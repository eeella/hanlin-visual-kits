<!DOCTYPE html><html><head><meta charset="UTF-8"><title>COMPILER</title></head><body>
<pre id="out" style="font:12px/1.7 monospace">running</pre>
<script>
window.onerror=function(m,s,l){document.getElementById('out').textContent='JS ERROR: '+m+' @'+l;document.title='COMPILER-ERR'};

/* ===== 多格式檔案解析器（純前端、無外部依賴） =====
   輸出統一的中介結構 Doc：
   { format, stack, blocks:[{type,level,text,items,rows,headers,meta}], fields:{}, raw }
*/
var Parser=(function(){
  /* --- ZIP（docx/xlsx 用），以瀏覽器原生 DecompressionStream 解 deflate --- */
  async function unzip(buf){
    var dv=new DataView(buf),files={},u8=new Uint8Array(buf);
    /* 找 End of Central Directory */
    var eocd=-1;
    for(var i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break} }
    if(eocd<0)throw new Error('不是有效的 ZIP');
    var cnt=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true);
    for(var k=0;k<cnt;k++){
      if(dv.getUint32(off,true)!==0x02014b50)break;
      var method=dv.getUint16(off+10,true);
      var csize=dv.getUint32(off+20,true);
      var nameLen=dv.getUint16(off+28,true),extraLen=dv.getUint16(off+30,true),cmtLen=dv.getUint16(off+32,true);
      var lho=dv.getUint32(off+42,true);
      var name=new TextDecoder().decode(u8.subarray(off+46,off+46+nameLen));
      /* local header */
      var lnameLen=dv.getUint16(lho+26,true),lextraLen=dv.getUint16(lho+28,true);
      var dataStart=lho+30+lnameLen+lextraLen;
      var data=u8.subarray(dataStart,dataStart+csize);
      files[name]={method:method,data:data};
      off+=46+nameLen+extraLen+cmtLen;
    }
    var out={};
    for(var nm in files){
      var f=files[nm];
      if(f.method===0){out[nm]=new TextDecoder().decode(f.data);continue}
      try{
        var ds=new DecompressionStream('deflate-raw');
        var stream=new Blob([f.data]).stream().pipeThrough(ds);
        out[nm]=await new Response(stream).text();
      }catch(e){out[nm]=''}
    }
    return out;
  }
  function xmlText(x){return (x||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim()}

  /* --- .docx --- */
  async function parseDocx(buf){
    var z=await unzip(buf);
    var xml=z['word/document.xml']||'';
    if(!xml)throw new Error('docx 內找不到 document.xml');
    var blocks=[];
    var paras=xml.match(/<w:p\b[\s\S]*?<\/w:p>/g)||[];
    paras.forEach(function(p){
      var style=(/w:pStyle w:val="([^"]+)"/.exec(p)||[])[1]||'';
      var txt=xmlText((p.match(/<w:t[^>]*>[\s\S]*?<\/w:t>/g)||[]).join(''));
      if(!txt)return;
      var lvl=/Heading(\d)/i.test(style)?+RegExp.$1:(/Title/i.test(style)?1:0);
      var isList=/ListParagraph/i.test(style)||/<w:numPr>/.test(p);
      blocks.push(lvl?{type:'heading',level:Math.min(lvl,4),text:txt}
                    :isList?{type:'listitem',text:txt}
                    :{type:'para',text:txt});
    });
    /* 表格 */
    (xml.match(/<w:tbl>[\s\S]*?<\/w:tbl>/g)||[]).forEach(function(t){
      var rows=(t.match(/<w:tr\b[\s\S]*?<\/w:tr>/g)||[]).map(function(r){
        return (r.match(/<w:tc\b[\s\S]*?<\/w:tc>/g)||[]).map(function(c){return xmlText((c.match(/<w:t[^>]*>[\s\S]*?<\/w:t>/g)||[]).join(''))});
      });
      if(rows.length)blocks.push({type:'table',headers:rows[0],rows:rows.slice(1)});
    });
    return {format:'Word (.docx)',stack:'OOXML 文件',blocks:blocks};
  }

  /* --- .xlsx --- */
  async function parseXlsx(buf){
    var z=await unzip(buf);
    var shared=[];
    var ss=z['xl/sharedStrings.xml']||'';
    (ss.match(/<si>[\s\S]*?<\/si>/g)||[]).forEach(function(si){shared.push(xmlText((si.match(/<t[^>]*>[\s\S]*?<\/t>/g)||[]).join('')))});
    var sheetName=Object.keys(z).filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/.test(n)}).sort()[0];
    var sheet=z[sheetName]||'';
    if(!sheet)throw new Error('xlsx 內找不到工作表');
    var rows=[];
    (sheet.match(/<row\b[\s\S]*?<\/row>/g)||[]).forEach(function(r){
      var cells=[];
      (r.match(/<c\b[^>]*(?:\/>|>[\s\S]*?<\/c>)/g)||[]).forEach(function(c){
        var t=(/ t="([^"]+)"/.exec(c)||[])[1];
        var v=(/<v>([\s\S]*?)<\/v>/.exec(c)||[])[1];
        var isv=(/<is>[\s\S]*?<t[^>]*>([\s\S]*?)<\/t>/.exec(c)||[])[1];
        var val=isv!==undefined?isv:(t==='s'?(shared[+v]||''):(v!==undefined?v:''));
        cells.push(String(val).trim());
      });
      if(cells.some(function(x){return x!==''}))rows.push(cells);
    });
    var blocks=rows.length?[{type:'table',headers:rows[0],rows:rows.slice(1)}]:[];
    return {format:'Excel (.xlsx)',stack:'OOXML 試算表',blocks:blocks};
  }

  /* --- CSV / TSV --- */
  function parseCsv(text,sep){
    sep=sep||(text.indexOf('\t')>-1&&text.indexOf(',')<0?'\t':',');
    var rows=[],cur=[],val='',q=false;
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){val+='"';i++} else q=false } else val+=ch }
      else{
        if(ch==='"')q=true;
        else if(ch===sep){cur.push(val.trim());val=''}
        else if(ch==='\n'){cur.push(val.trim());rows.push(cur);cur=[];val=''}
        else if(ch!=='\r')val+=ch;
      }
    }
    if(val||cur.length){cur.push(val.trim());rows.push(cur)}
    rows=rows.filter(function(r){return r.some(function(c){return c!==''})});
    return {format:'CSV/TSV',stack:'分隔文字',blocks:rows.length?[{type:'table',headers:rows[0],rows:rows.slice(1)}]:[]};
  }

  /* --- Markdown --- */
  function parseMd(text){
    var blocks=[],lines=text.split(/\r?\n/),tbuf=[];
    function flushTable(){
      if(tbuf.length>=2){
        var hdr=tbuf[0].split('|').map(function(s){return s.trim()}).filter(Boolean);
        var body=tbuf.slice(2).map(function(l){return l.split('|').map(function(s){return s.trim()}).filter(function(_,i,a){return true}).filter(Boolean)});
        blocks.push({type:'table',headers:hdr,rows:body});
      }
      tbuf=[];
    }
    lines.forEach(function(l){
      if(/^\s*\|/.test(l)){tbuf.push(l.replace(/^\s*\|/,'').replace(/\|\s*$/,''));return}
      flushTable();
      var h=/^(#{1,4})\s+(.*)$/.exec(l);
      if(h){blocks.push({type:'heading',level:h[1].length,text:h[2].trim()});return}
      var li=/^\s*[-*+]\s+(.*)$/.exec(l)||/^\s*\d+\.\s+(.*)$/.exec(l);
      if(li){blocks.push({type:'listitem',text:li[1].trim()});return}
      if(l.trim())blocks.push({type:'para',text:l.trim()});
    });
    flushTable();
    return {format:'Markdown',stack:'Markdown 文件',blocks:blocks};
  }

  /* --- HTML --- */
  function parseHtml(text){
    var doc=new DOMParser().parseFromString(text,'text/html');
    var blocks=[];
    var stack=[];
    if(/cdn\.tailwindcss|tailwind\./i.test(text))stack.push('Tailwind CSS');
    if(/bootstrap[.-]/i.test(text))stack.push('Bootstrap');
    if(/\bant-btn\b|antd/i.test(text))stack.push('Ant Design');
    if(/\bv-btn\b|vuetify/i.test(text))stack.push('Vuetify');
    if(/\bel-button\b/i.test(text))stack.push('Element Plus');
    if(/\bMui[A-Z]/.test(text))stack.push('Material UI');
    if(/react|_jsx|useState/i.test(text))stack.push('React');
    if(/\bv-if\b|\bv-for\b|createApp|x-data/i.test(text))stack.push('Vue／Alpine');
    Array.prototype.forEach.call(doc.body?doc.body.querySelectorAll('h1,h2,h3,h4,p,li,table,button,a'):[],function(el){
      var t=(el.textContent||'').trim();
      if(el.tagName==='TABLE'){
        var hdr=Array.prototype.map.call(el.querySelectorAll('thead th, tr:first-child th, tr:first-child td'),function(c){return (c.textContent||'').trim()});
        var rows=Array.prototype.map.call(el.querySelectorAll('tbody tr'),function(r){return Array.prototype.map.call(r.querySelectorAll('td,th'),function(c){return (c.textContent||'').trim()})}).filter(function(r){return r.length});
        if(hdr.length)blocks.push({type:'table',headers:hdr,rows:rows});
        return;
      }
      if(!t)return;
      if(/^H[1-4]$/.test(el.tagName))blocks.push({type:'heading',level:+el.tagName[1],text:t});
      else if(el.tagName==='LI')blocks.push({type:'listitem',text:t});
      else if(el.tagName==='BUTTON'||(el.tagName==='A'&&/btn|button|cta/i.test(el.className||'')))blocks.push({type:'action',text:t,meta:{primary:/primary|submit|cta/i.test(el.className||'')}});
      else if(el.tagName==='P')blocks.push({type:'para',text:t});
    });
    return {format:'HTML',stack:stack.length?stack.join('＋'):'原生 HTML',blocks:blocks};
  }

  /* --- JSON --- */
  function parseJson(text){
    var data=JSON.parse(text);
    var blocks=[];
    function walk(v,key,depth){
      if(Array.isArray(v)){
        if(v.length&&typeof v[0]==='object'&&v[0]&&!Array.isArray(v[0])){
          var headers=Object.keys(v[0]);
          blocks.push({type:'table',headers:headers,rows:v.map(function(o){return headers.map(function(h){return o[h]===undefined?'':String(o[h])})}),meta:{key:key}});
        }else{
          v.forEach(function(x){ if(typeof x!=='object')blocks.push({type:'listitem',text:String(x)}) });
        }
        return;
      }
      if(v&&typeof v==='object'){
        Object.keys(v).forEach(function(k){
          var val=v[k];
          if(val&&typeof val==='object')  { if(depth<3){blocks.push({type:'heading',level:Math.min(depth+2,4),text:k});walk(val,k,depth+1)} }
          else blocks.push({type:'field',text:String(val),meta:{key:k,type:typeof val}});
        });
        return;
      }
      blocks.push({type:'para',text:String(v)});
    }
    walk(data,'',0);
    return {format:'JSON',stack:'JSON 資料',blocks:blocks,data:data};
  }

  /* --- 純文字 --- */
  function parseTxt(text){
    var blocks=[];
    text.split(/\r?\n/).forEach(function(l){
      l=l.trim();if(!l)return;
      if(/^[-*•]\s+/.test(l))blocks.push({type:'listitem',text:l.replace(/^[-*•]\s+/,'')});
      /* 含冒號的 key: value 交給語意層判定（指標／狀態／欄位），不可先當成標題 */
      else if(/^.{1,14}[:：]\s*\S/.test(l))blocks.push({type:'para',text:l});
      else if(l.length<=24&&!/[。.!?，,；;]$/.test(l))blocks.push({type:'heading',level:2,text:l});
      else blocks.push({type:'para',text:l});
    });
    return {format:'純文字',stack:'Plain Text',blocks:blocks};
  }

  /* --- PDF（文字型的簡易抽取） --- */
  async function parsePdf(buf){
    var u8=new Uint8Array(buf);
    var latin=new TextDecoder('latin1').decode(u8);
    var texts=[];
    /* 解壓 FlateDecode 串流後抽 Tj/TJ 文字 */
    var re=/stream\r?\n([\s\S]*?)endstream/g,m;
    while((m=re.exec(latin))){
      var chunk=m[1];
      var bytes=new Uint8Array(chunk.length);
      for(var i=0;i<chunk.length;i++)bytes[i]=chunk.charCodeAt(i)&0xff;
      var txt='';
      try{
        var ds=new DecompressionStream('deflate');
        txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
      }catch(e){ txt=chunk }
      (txt.match(/\((?:\\.|[^()\\])*\)\s*Tj|\[(?:[^\][]|\\.)*\]\s*TJ/g)||[]).forEach(function(seg){
        (seg.match(/\((?:\\.|[^()\\])*\)/g)||[]).forEach(function(s){
          texts.push(s.slice(1,-1).replace(/\\([()\\])/g,'$1'));
        });
      });
    }
    var joined=texts.join('').replace(/\s{2,}/g,' ').trim();
    if(!joined)throw new Error('PDF 無法抽取文字（可能是掃描影像型）');
    return Object.assign(parseTxt(joined),{format:'PDF',stack:'PDF 文字流'});
  }

  async function parse(name,content,buf){
    var ext=(name.split('.').pop()||'').toLowerCase();
    if(ext==='docx')return await parseDocx(buf);
    if(ext==='xlsx'||ext==='xlsm')return await parseXlsx(buf);
    if(ext==='pdf')return await parsePdf(buf);
    if(ext==='csv'||ext==='tsv')return parseCsv(content);
    if(ext==='md'||ext==='markdown')return parseMd(content);
    if(ext==='json')return parseJson(content);
    if(ext==='html'||ext==='htm')return parseHtml(content);
    if(ext==='js'||ext==='ts'||ext==='jsx'||ext==='tsx'||ext==='vue'){
      var d=parseTxt(content);d.format='原始碼 ('+ext+')';d.stack=/react|useState|jsx/i.test(content)?'React':(/vue|ref\(|defineComponent/i.test(content)?'Vue':'JavaScript');
      /* 嘗試從程式碼中抽出資料結構 */
      var objs=content.match(/\{[\s\S]{20,800}?\}/g)||[];
      for(var i=0;i<objs.length;i++){try{var o=JSON.parse(objs[i]);var jd=parseJson(JSON.stringify(o));d.blocks=d.blocks.concat(jd.blocks);break}catch(e){}}
      return d;
    }
    /* 內容嗅探 */
    var t=(content||'').trim();
    if(/^[\[{]/.test(t)){try{return parseJson(t)}catch(e){}}
    if(/<html|<body|<div|<section/i.test(t))return parseHtml(t);
    if(/^#{1,4}\s|\n\|.*\|/.test(t))return parseMd(t);
    if(t.split('\n').length>1&&/,|\t/.test(t.split('\n')[0]))return parseCsv(t);
    return parseTxt(t);
  }
  return {parse:parse,unzip:unzip};
})();


/* ===== 功能語意判定：把內容抽象化為 UI 意圖 ===== */
var Semantic=(function(){
  var STATUS={
    success:/已完成|完成|成功|通過|啟用|上線|正常|已付款|已結案|active|done|success|passed|approved|paid/i,
    warning:/審核中|處理中|待審|待辦|進行中|等待|逾期提醒|注意|pending|review|processing|warning|in progress/i,
    danger:/失敗|錯誤|逾期|停用|退件|取消|異常|警報|超標|failed|error|rejected|overdue|danger|alert|critical/i,
    info:/未開始|草稿|預約|排程|新增|待處理|draft|scheduled|new|info|todo/i
  };
  var ACTION=/^(?:立即|馬上|開始|前往|查看|檢視|下載|上傳|送出|提交|儲存|新增|編輯|刪除|取消|確認|登入|註冊|報名|訂閱|聯絡|了解更多|更多|返回|下一步|上一步)/;
  var ACTION_EN=/^(?:get started|start|view|see|download|upload|submit|save|add|edit|delete|cancel|confirm|login|sign ?up|sign ?in|subscribe|contact|learn more|read more|next|back|continue|try)/i;
  var METRIC=/^([\d,]+(?:\.\d+)?)\s*(%|％|人|位|個|件|次|筆|項|天|小時|分鐘|元|萬|億|k|K|M|\+)?$/;
  var KV=/^(.{1,14})[:：]\s*(.+)$/;

  function statusOf(t){
    for(var k in STATUS){if(STATUS[k].test(t))return k}
    return null;
  }
  /* 完整匹配：整段文字本身就是狀態詞才算標籤 */
  function statusExact(t){
    var s2=String(t).trim();
    for(var k in STATUS){
      var m=STATUS[k].exec(s2);
      if(m&&m[0].length>=s2.length-1)return k;
    }
    return null;
  }
  function analyze(doc){
    var out=[],stats=[],actions=[],badges=[];
    (doc.blocks||[]).forEach(function(b){
      if(b.type==='heading'){
        /* 短標題若本身是動作文字，語意上其實是按鈕（解析層看不出來，這裡糾正） */
        var ht=(b.text||'').trim();
        if((ACTION.test(ht)||ACTION_EN.test(ht))&&ht.length<=10){
          actions.push({text:ht,primary:actions.length===0});
          out.push({intent:'action',text:ht,primary:actions.length===1});return;
        }
        out.push({intent:'heading',level:b.level,text:ht});return;
      }
      if(b.type==='table'){
        /* 標題列若含狀態欄，標記需要 badge 欄 */
        var statusCols=[];
        (b.headers||[]).forEach(function(h,i){ if(/狀態|status|state|進度|結果/i.test(h))statusCols.push(i) });
        out.push({intent:'table',headers:b.headers,rows:b.rows,statusCols:statusCols});
        return;
      }
      if(b.type==='listitem'){
        var st=statusOf(b.text);
        /* 條列仍是條列，只在短且為純狀態詞時才轉標籤；否則附帶狀態色點 */
        if(statusExact(b.text)){badges.push({text:b.text,tone:st});out.push({intent:'badge',text:b.text,tone:st});return}
        out.push({intent:'listitem',text:b.text,tone:st||null});return;
      }
      if(b.type==='action'){actions.push({text:b.text,primary:!!(b.meta&&b.meta.primary)});out.push({intent:'action',text:b.text,primary:!!(b.meta&&b.meta.primary)});return}
      if(b.type==='field'){
        var key=(b.meta&&b.meta.key)||'',val=b.text;
        var m=METRIC.exec(String(val).trim());
        if(m&&(b.meta&&b.meta.type!=='boolean')){stats.push({label:key,value:m[1],unit:m[2]||''});out.push({intent:'metric',label:key,value:m[1],unit:m[2]||''});return}
        var st2=statusOf(String(val));
        if(st2){out.push({intent:'badge',text:String(val),tone:st2,label:key});return}
        if(typeof (b.meta&&b.meta.type)==='string'&&b.meta.type==='boolean'){out.push({intent:'badge',text:String(val)==='true'?'是':'否',tone:String(val)==='true'?'success':'info',label:key});return}
        out.push({intent:'field',label:key,text:val});return;
      }
      /* para：再細分 */
      var t=(b.text||'').trim();
      var kv=KV.exec(t);
      if(kv){
        var mm=METRIC.exec(kv[2].trim());
        if(mm){stats.push({label:kv[1],value:mm[1],unit:mm[2]||''});out.push({intent:'metric',label:kv[1],value:mm[1],unit:mm[2]||''});return}
        var st3=statusOf(kv[2]);
        if(st3){out.push({intent:'badge',text:kv[2].trim(),tone:st3,label:kv[1]});return}
        out.push({intent:'field',label:kv[1],text:kv[2].trim()});return;
      }
      if((ACTION.test(t)||ACTION_EN.test(t))&&t.length<=14){
        actions.push({text:t,primary:actions.length===0});
        out.push({intent:'action',text:t,primary:actions.length===1});return;
      }
      var st4=statusOf(t);
      /* 完整句子不是標籤：需短、無標點、非敘述句 */
      if(statusExact(t)){badges.push({text:t,tone:st4});out.push({intent:'badge',text:t,tone:st4});return}
      out.push({intent:'paragraph',text:t});
    });
    /* 組成區塊：連續的 metric 併成統計列；heading 之後的內容歸屬該段 */
    var summary={
      headings:out.filter(function(x){return x.intent==='heading'}).length,
      tables:out.filter(function(x){return x.intent==='table'}).length,
      metrics:out.filter(function(x){return x.intent==='metric'}).length,
      badges:out.filter(function(x){return x.intent==='badge'}).length,
      actions:out.filter(function(x){return x.intent==='action'}).length,
      lists:out.filter(function(x){return x.intent==='listitem'}).length,
      fields:out.filter(function(x){return x.intent==='field'}).length,
      paragraphs:out.filter(function(x){return x.intent==='paragraph'}).length
    };
    return {intents:out,summary:summary};
  }
  /* 驗收：能否抽出 UI 語意 */
  function review(doc,ana){
    var s=ana.summary;
    var uiSignals=s.headings+s.tables+s.metrics+s.badges+s.actions+s.lists+s.fields;
    var missing=[];
    if(!s.headings)missing.push('缺少標題層級（將以第一段文字或檔名補為 h1）');
    if(!s.tables&&!s.metrics&&!s.lists&&!s.fields)missing.push('缺少結構化資料（表格／指標／條列／欄位）');
    if(!s.actions)missing.push('缺少互動語意（未偵測到可轉為按鈕的動作文字）');
    var verdict;
    if(uiSignals===0&&s.paragraphs===0)verdict='拒絕收件';
    else if(uiSignals===0)verdict='拒絕收件';
    else if(missing.length>=2)verdict='條件性通過';
    else verdict='完全通過';
    return {verdict:verdict,missing:missing,signals:uiSignals};
  }
  return {analyze:analyze,review:review};
})();


/* ===== 程式碼產生器：JSON 結構層 / Vue3+Tailwind 元件層 / 邏輯層 ===== */
var Generator=(function(){
  /* ── 讀取品牌規範採用結果，產出「已套用規範」的元件 ── */
  function mixW(hex,w){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    function m(v){return Math.round(v+(255-v)*w)}
    return '#'+[m(r),m(g),m(b)].map(function(v){return v.toString(16).padStart(2,'0')}).join('').toUpperCase()}
  function mixB(hex,w){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    function m(v){return Math.round(v*(1-w))}
    return '#'+[m(r),m(g),m(b)].map(function(v){return v.toString(16).padStart(2,'0')}).join('').toUpperCase()}
  var HD_NAMES=['品牌官網（淺色）','品牌官網（深色）','教師平台','國小／兒童','國中／高中學術','命題大師','行動大師','影音派','AI 數位導覽員'];
  function brand(){
    var st=null;

    if(!st||!st.theme)st={theme:{n:'翰林藍',p:'#0088D2',s:'#005696',i:'#40B4E5',c:'#FF9A3C'},groups:{hd:1,ft:2,hero:0,fm:0,tblsty:0,icon:0}};
    var t=st.theme,g=st.groups||{};
    var hd=(typeof g.hd==='number')?g.hd:1;
    var hdDark=[1,3,4,7,8].indexOf(hd)>-1;
    var HD_BG=['#FFFFFF',(t.s||t.p),'#FFFFFF','linear-gradient(120deg,'+(t.i||t.p)+' 0%,'+t.p+' 100%)',mixB(t.s||t.p,.25),'#FFFFFF',mixW(t.p,.9),'#1B1D21','linear-gradient(120deg,'+t.p+' 0%,'+(t.i||t.p)+' 100%)'];
    return {
      name:t.n||'翰林藍',
      p:t.p, s:t.s||t.p, i:t.i||t.p, c:t.c||'#FF9A3C',
      soft:mixW(t.p,.9), soft2:mixW(t.p,.82), deep:mixB(t.s||t.p,.2),
      ink:'#3A3D42', ink2:'#8C9099', line:'#E6E8EC', page:'#F5F7FA', gray:'#EFF2F5',
      success:'#26A649', warning:'#E08A1E', danger:'#DE3535', info:'#2E9BE6',
      successSoft:'#E4F4E8', warningSoft:'#FDF0DC', dangerSoft:'#F8E2E2', infoSoft:'#E3F2FC',
      hdIdx:hd, hdName:HD_NAMES[hd]||'品牌官網（深色）', hdBg:HD_BG[hd]||(t.s||t.p), hdFg:hdDark?'#FFFFFF':'#3A3D42',
      ftIdx:(typeof g.ft==='number')?g.ft:2,
      ftBg:((typeof g.ft==='number')?g.ft:2)===2?(t.s||t.p):(((typeof g.ft==='number')?g.ft:2)===1?mixW(t.p,.92):'#F7F9FB'),
      ftFg:((typeof g.ft==='number')?g.ft:2)===2?'#FFFFFF':'#8C9099',
      heroIdx:(typeof g.hero==='number')?g.hero:0,
      heroBg:((typeof g.hero==='number')?g.hero:0)===0
        ? 'linear-gradient(135deg,'+t.p+' 0%,'+(t.i||t.p)+' 100%)'
        : 'linear-gradient(140deg,'+(t.i||t.p)+' 0%,'+mixW(t.p,.6)+' 45%,'+t.p+' 100%)',
      fmIdx:(typeof g.fm==='number')?g.fm:0,

    };

  function toneMap(B){return {
    success:{badge:'bg-['+B.successSoft+'] text-['+B.success+']',dot:'bg-['+B.success+']'},
    warning:{badge:'bg-['+B.warningSoft+'] text-['+B.warning+']',dot:'bg-['+B.warning+']'},
    danger:{badge:'bg-['+B.dangerSoft+'] text-['+B.danger+']',dot:'bg-['+B.danger+']'},

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function camel(s){return String(s||'').replace(/[^\w\u4e00-\u9fff]+(.)/g,function(_,c){return c.toUpperCase()}).replace(/^[^a-zA-Z_]+/,'')||'field'}
  function num(v){var n=String(v).replace(/[,\s]/g,'');return /^-?\d+(\.\d+)?$/.test(n)?parseFloat(n):null}
  function typed(v){
    if(v===null||v===undefined)return null;
    var s=String(v).trim();
    if(/^(true|是|有|yes|y)$/i.test(s))return true;
    if(/^(false|否|無|no|n)$/i.test(s))return false;
    var n=num(s);return n!==null?n:s;
  }

  /* ---- 1. JSON 結構層 ---- */
  function toJSON(doc,ana,meta){
    var o={_metadata:{source_format:doc.format,detected_stack:doc.stack,generated_at:meta.now,semantic_signals:ana.summary}};
    var cur=o,sections=[],curSec=null;
    ana.intents.forEach(function(x){
      if(x.intent==='heading'){curSec={title:x.text,level:x.level,content:[]};sections.push(curSec);return}
      var target=curSec?curSec.content:(o.content||(o.content=[]));
      if(x.intent==='metric')target.push({type:'metric',label:x.label,value:typed(x.value),unit:x.unit||null});
      else if(x.intent==='badge')target.push({type:'status',label:x.label||null,value:x.text,tone:x.tone});
      else if(x.intent==='table'){
        var keys=x.headers.map(camel);
        target.push({type:'table',columns:x.headers.map(function(h,i){return {key:keys[i],title:h,is_status:x.statusCols.indexOf(i)>-1}}),
          rows:x.rows.map(function(r){var ro={};keys.forEach(function(k,i){ro[k]=typed(r[i])});return ro})});
      }
      else if(x.intent==='action')target.push({type:'action',label:x.text,variant:x.primary?'primary':'secondary'});
      else if(x.intent==='listitem')target.push({type:'list_item',text:x.text,tone:x.tone||null});
      else if(x.intent==='field')target.push({type:'field',label:x.label,value:typed(x.text)});
      else target.push({type:'text',text:x.text});
    });
    if(sections.length)o.sections=sections;
    return o;
  }

    t.push('    <section class="px-6 py-14 text-center sm:px-8 sm:py-16" style="' + heroStyle + '">');

    if (tables.length) {

    var sc = [];

  function mixWjs(hex){return mixW(hex,.9)}

  /* ---- Vanilla JS 版本（不使用框架時） ---- */
  function toVanilla(json){
    return [
      '/* 資料與畫面解耦：改 SOURCE 即可換內容 */',
      'const SOURCE = '+JSON.stringify(json,null,2)+';',
      '',
      'const TONE = {',
      '  success: \'bg-green-50 text-green-700 ring-green-600/20\',',
      '  warning: \'bg-yellow-50 text-yellow-800 ring-yellow-600/20\',',
      '  danger: \'bg-red-50 text-red-700 ring-red-600/20\',',
      '  info: \'bg-sky-50 text-sky-700 ring-sky-600/20\',',
      '  neutral: \'bg-slate-100 text-slate-700 ring-slate-500/20\'',
      '};',
      'const toneOf = (v) => {',
      '  const s = String(v ?? \'\');',
      '  if (/已完成|完成|成功|通過|啟用|done|success/i.test(s)) return \'success\';',
      '  if (/審核中|處理中|進行中|待|pending|review/i.test(s)) return \'warning\';',
      '  if (/失敗|錯誤|逾期|停用|取消|failed|error/i.test(s)) return \'danger\';',
      '  if (/未開始|草稿|排程|draft|new/i.test(s)) return \'info\';',
      '  return \'neutral\';',
      '};',
      '',
      'document.querySelectorAll(\'[data-action]\').forEach((el) => {',
      '  el.addEventListener(\'click\', () => {',
      '    el.dispatchEvent(new CustomEvent(\'app:action\', { bubbles: true, detail: { label: el.dataset.action } }));',
      '  });',
      '});'
    ].join('\n');
  }
  return {toJSON:toJSON,toVue:toVue,toVanilla:toVanilla};
