  function normHex(h){
    h=h.toUpperCase();
    if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
    return h;
  }
  function mixW(hex,w){ /* 與白混合 */
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    function m(v){return Math.round(v+(255-v)*w)}
    return '#'+[m(r),m(g),m(b)].map(function(v){return v.toString(16).padStart(2,'0')}).join('').toUpperCase();
  }
  function mixB(hex,w){ /* 與黑混合 */
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    function m(v){return Math.round(v*(1-w))}
    return '#'+[m(r),m(g),m(b)].map(function(v){return v.toString(16).padStart(2,'0')}).join('').toUpperCase();
  }
  function lum(r,g,b){return (0.2126*r+0.7152*g+0.0722*b)/255}
  function toneFor(r,g,b,to){
    var L=lum(r,g,b);
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h;
    if(mx===r)h=((g-b)/d*60+360)%360;
    else if(mx===g)h=(b-r)/d*60+120;
    else h=(r-g)/d*60+240;
    var base;
    if(h<20||h>=340)base='#DE3535';                /* 紅 → 危險紅 */
    else if(h<45)base=to.c||'#FF9A3C';             /* 橘 → 對比暖色 */
    else if(h<70)base='#F5B32F';                   /* 黃 → 琥珀金 */
    else if(h<170)base='#26A649';                  /* 綠 → 成功綠 */
    else if(h<200)base='#22CFC9';                  /* 青 → 中間色 Teal */
    else if(h<300){                                /* 藍紫 → 品牌色家族 */
      if(L<0.3)return to.s||mixB(to.p,.35);
      if(L<0.62)return to.p;
      return to.i||mixW(to.p,.35);
    }
    else base=to.c||'#FF9A3C';                     /* 粉紅 → 對比暖色 */
    /* 依原色明暗保留層次 */
    if(L>=0.82)return mixW(base,.8);
    if(L>=0.65)return mixW(base,.45);
    if(L<=0.28)return mixB(base,.3);
    return base;
  }
