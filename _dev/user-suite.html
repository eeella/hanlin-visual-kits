xed;inset:0;z-index:60;background:rgba(243,246,252,.85);backdrop-filter:blur(3px);display:grid;place-items:center}\n  .spinner{width:66px;height:66px;border:6px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 22px}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  .loading h2{font-size:24px;text-align:center}\n  .loading p{text-align:center;color:var(--muted);margin-top:10px;line-height:1.7}\n\n  /* ================= RESULT（正式 demo 版） ================= */\n  .res-wrap{max-width:980px;margin:0 auto;padding:28px 24px 116px}\n\n  /* 卷頭卡（詳答卷樣式，置左） */\n  .exam-paper{position:relative;padding:0;background:transparent;border:none;box-shadow:none;color:#26303f;font-size:15.5px}\n  .paper-note{display:inline-block;font-size:11.5px;color:var(--muted-2);background:#F5F8FE;border:1px dashed var(--brand-line);padding:4px 12px;border-radius:20px;margin-bottom:14px}\n  .exam-head{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);text-align:left;padding:22px 28px;margin-bottom:18px}\n  .exam-head .eh-line{font-size:16px;font-weight:700;color:#1a1a1a;line-height:2.3;letter-spacing:.5px}\n  .exam-head .eh-range{font-size:13.5px;color:#5a6478;margin-top:6px}\n  .exam-head .blank{display:inline-block;border-bottom:1px solid #555;min-width:54px;text-align:center;line-height:1.2}\n  .exam-head .blank.wide{min-width:150px}\n\n  /* 單題卡（左採用欄 + 右內容，區隔明顯） */\n  .eq{position:relative;display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:18px 22px;margin-bottom:16px;transition:.12s}\n  .eq:hover{border-color:var(--brand-line);box-shadow:var(--shadow)}\n  .eq.skip{background:#f5f7fa}\n  .eq.skip .eq-body{color:#9aa6bd}\n  .eq.skip .eq-badge{background:#c3ccdb}\n  .eq.skip .ans-box{opacity:.5}\n  .eq.thinking{border-color:#BFE6D4}\n\n  /* 全選/取消列（卷頭下方） */\n  .select-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:10px 18px;margin-bottom:16px;flex-wrap:wrap}\n  .select-row .sr-label{font-size:13.5px;font-weight:800;color:var(--ink)}\n  .sr-btn{font-size:13px;font-weight:700;color:var(--brand);background:#fff;border:1.5px solid var(--brand-line);padding:8px 14px;border-radius:9px}\n  .sr-btn:hover{background:var(--brand-soft)}\n  .select-row .sr-hint{margin-left:auto;font-size:12.5px;color:var(--muted)}\n\n  /* 左側採用欄 */\n  .eq-left{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px;border-right:1px solid #eef1f6;padding-right:16px}\n  .adopt-box{width:28px;height:28px;border-radius:50%;border:2px solid var(--ok);background:var(--ok);color:#fff;display:grid;place-items:center;font-size:15px;cursor:pointer;transition:.12s;user-select:none}\n  .adopt-box:hover{transform:scale(1.08)}\n  .eq.skip .adopt-box{background:#fff;border-color:#c3ccdb;color:transparent}\n  .adopt-lab{font-size:11px;font-weight:800;color:var(--ok);white-space:nowrap}\n  .eq.skip .adopt-lab{color:var(--muted-2)}\n\n  .eq-body{flex:1;min-width:0}\n\n  /* 每題右上角的 AI換題按鈕（寬度隨字） */\n  .eq-toprow{display:flex;justify-content:flex-end;margin-bottom:6px}\n  .ai-swap{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--brand-dark);background:#fff;border:1.5px solid var(--brand-line);padding:6px 12px;border-radius:8px;white-space:nowrap;transition:.12s}\n  .ai-swap:hover{background:var(--brand-soft);border-color:var(--brand)}\n  .ai-swap:disabled{opacity:.45;cursor:not-allowed}\n\n  .eq-head{display:flex;gap:10px;align-items:flex-start;line-height:1.85}\n  .eq-badge{flex:none;width:24px;height:24px;border-radius:50%;background:#2b3b52;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:3px}\n  .eq-badge.off{background:#aab4c5}\n  .eq-paren{flex:none;color:#333;font-weight:600;margin-top:1px}\n  .eq-stem{flex:1}\n  .q-flag{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 9px;border-radius:12px;margin-left:6px;white-space:nowrap}\n  .q-diff{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:12px;margin-left:6px;white-space:nowrap}\n  .q-diff.hard{color:var(--hard);background:var(--hard-soft)}\n  .q-diff.easy{color:var(--easy);background:var(--easy-soft)}\n  .q-diff.edited{color:var(--purple-dark);background:#EEEBFB}\n  .eq-opts{margin:8px 0 0 34px;display:grid;gap:5px;line-height:1.7}\n  .eq-opt{display:flex;gap:9px}\n  .eq-opt .on{flex:none;color:#333}\n  .eq-fill{margin:8px 0 0 34px;color:#555;letter-spacing:2px}\n  .eq-img{border:1px solid var(--line);border-radius:10px;padding:14px;max-width:300px;margin:12px 0 0 34px;background:#fafbfe}\n  .eq-img .book-ref{background:#eef2f9;color:var(--muted);font-size:12px;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:10px}\n\n  /* 綠色正解框 */\n  .ans-box{margin:14px 0 0 34px;background:#eef8f1;border:1px solid #cfe8d8;border-radius:12px;padding:14px 18px}\n  .ans-box .ab-ans{color:#1e9e6a;font-weight:800;font-size:14.5px;margin-bottom:7px}\n  .ans-box .ab-exp{color:#4a5568;font-size:14px;line-height:1.85}\n\n  /* thinking 遮罩 */\n  .think-veil{position:absolute;inset:0;background:rgba(242,248,245,.72);backdrop-filter:blur(1px);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;color:var(--ai-green);font-size:15px;z-index:5}\n  .think-veil .mini-spin{width:22px;height:22px;border:3px solid #CDEBDD;border-top-color:var(--ai-green);border-radius:50%;animation:spin .8s linear infinite}\n\n  .res-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 6px 0;font-size:12.5px;color:var(--muted-2)}\n\n  /* 底部固定操作列（貼齊視窗底部、不浮動） */\n  .bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(27,84,179,.08);display:flex;align-items:center;gap:12px;padding:12px 28px}\n  .bb-btn{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;padding:11px 20px;border-radius:11px;transition:.12s;white-space:nowrap}\n  .bb-btn.back{color:var(--brand);background:var(--brand-soft)}\n  .bb-btn.back:hover{background:#dbe8fb}\n  .bb-btn.regen-all{color:#fff;background:linear-gradient(120deg,var(--purple),var(--purple-dark))}\n  .bb-btn.regen-all:hover{opacity:.92;transform:translateY(-1px)}\n  .bb-count{font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap;margin-right:2px}\n  .bb-spacer{margin-left:auto}\n  .bb-btn:disabled{opacity:.5;cursor:not-allowed}\n  .bb-btn.docx{color:#fff;background:var(--brand-dark)}\n  .bb-btn.pdf{color:#fff;background:#E5732B}\n  .bb-btn.docx:hover,.bb-btn.pdf:hover{opacity:.9;transform:translateY(-1px)}\n  @media(max-width:660px){.bottom-bar{flex-wrap:wrap;gap:8px;padding:10px 14px}.bb-btn{padding:9px 14px;font-size:13px}.bb-spacer{display:none}}\n\n  /* toast */\n  .toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center}\n  .toast{background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:toastIn .25s ease}\n  .toast .t-ico{font-size:16px}\n  .toast.ok{background:#14603F}\n  .toast.ai{background:#3B2E86}\n  @keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n\n  /* flex:none + min-height → footer 高度兩頁一致，不會被壓縮或被切掉 */\n  .site-foot{flex:none;min-height:88px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(100deg,var(--brand-dark),var(--brand));color:#fff;text-align:center;padding:18px 20px;font-size:13.5px;line-height:1.9}\n  .site-foot .foot-sub{opacity:.85;font-size:12.5px}\n</style>\n</head>\n<body>\n\n<!-- ===== NAV ===== -->\n<div class=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"brand\" onclick=\"goHome()\">\n      <div class=\"brand-badge\">翰</div>\n      <div class=\"brand-title\">翰林 <span class=\"ai-chip\">AI</span> 智慧成卷</div>\n    </div>\n    <div class=\"nav-right\">\n      <div class=\"nav-tabs hidden\" id=\"nav-tabs\">\n        <button class=\"nav-tab\" data-mode=\"random\" onclick=\"switchMode('random')\">卷類抽題</button>\n        <button class=\"nav-tab\" data-mode=\"compose\" onclick=\"switchMode('compose')\">上傳成卷生題</button>\n      </div>\n      <!-- 右上角點數（參考評語精靈） -->\n      <div class=\"points\" id=\"points\" onclick=\"showPoints()\" title=\"剩餘點數\">\n        <span class=\"pt-coin\" id=\"pt-coin\">20</span>\n        <span class=\"pt-lab\">點數</span>\n      </div>\n      <span class=\"nav-sep\"></span>\n      <div class=\"user\"><span class=\"avatar\">王</span> <span>Hi, 王小明</span> ▾</div>\n    </div>\n  </div>\n</div>\n\n<!-- ===== HOME ===== -->\n<div id=\"screen-home\" class=\"page\">\n  <div class=\"home-wrap\">\n    <div class=\"banner\">\n      <div class=\"banner-text\">\n        <div class=\"banner-title\">翰林 <span class=\"ai-logo\">AI</span> 智慧成卷</div>\n        <div class=\"banner-sub\"><span class=\"spark\">✦</span> 智能抓題 、類題生成，成卷好題方便再運用！</div>\n      </div>\n      <div class=\"banner-art\">\n        <svg viewBox=\"0 0 200 210\" xmlns=\"http://www.w3.org/2000/svg\">\n          <ellipse cx=\"100\" cy=\"196\" rx=\"52\" ry=\"9\" fill=\"rgba(0,0,0,.18)\"/>\n          <rect x=\"60\" y=\"150\" width=\"80\" height=\"42\" rx=\"16\" fill=\"#EAF1FB\"/>\n          <rect x=\"70\" y=\"60\" width=\"60\" height=\"14\" rx=\"7\" fill=\"#C9DAF3\"/>\n          <circle cx=\"100\" cy=\"50\" r=\"7\" fill=\"#FFD84D\"/>\n          <rect x=\"97\" y=\"55\" width=\"6\" height=\"10\" fill=\"#C9DAF3\"/>\n          <rect x=\"46\" y=\"70\" width=\"108\" height=\"88\" rx=\"30\" fill=\"#FFFFFF\"/>\n          <rect x=\"60\" y=\"86\" width=\"80\" height=\"52\" rx=\"22\" fill=\"#1B54B3\"/>\n          <circle cx=\"84\" cy=\"112\" r=\"10\" fill=\"#7FE4FF\"/>\n          <circle cx=\"116\" cy=\"112\" r=\"10\" fill=\"#7FE4FF\"/>\n          <circle cx=\"86\" cy=\"110\" r=\"3.5\" fill=\"#0E367A\"/>\n          <circle cx=\"118\" cy=\"110\" r=\"3.5\" fill=\"#0E367A\"/>\n          <path d=\"M92 128 q8 6 16 0\" stroke=\"#7FE4FF\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>\n          <rect x=\"34\" y=\"96\" width=\"14\" height=\"30\" rx=\"7\" fill=\"#EAF1FB\"/>\n          <rect x=\"152\" y=\"96\" width=\"14\" height=\"30\" rx=\"7\" fill=\"#EAF1FB\"/>\n          <rect x=\"150\" y=\"118\" width=\"30\" height=\"12\" rx=\"6\" fill=\"#EAF1FB\" transform=\"rotate(24 150 118)\"/>\n        </svg>\n      </div>\n      <span class=\"confetti\" style=\"top:24px;left:44%;width:9px;height:9px;background:#FFD84D;transform:rotate(20deg)\"></span>\n      <span class=\"confetti\" style=\"top:52px;left:52%;width:7px;height:7px;background:#7FE4FF\"></span>\n      <span class=\"confetti\" style=\"top:120px;left:47%;width:8px;height:8px;background:#FF9BB0;transform:rotate(35deg)\"></span>\n      <span class=\"confetti\" style=\"top:150px;left:56%;width:6px;height:6px;background:#B6F0C6\"></span>\n    </div>\n\n    <div class=\"home-head\">請選擇成卷模式</div>\n    <div class=\"home-cards\">\n      <div class=\"home-card blue\" onclick=\"openMode('random')\">\n        <div class=\"hc-ico\">🎲</div>\n        <div class=\"hc-title\">卷類抽題</div>\n        <div class=\"hc-desc\">選擇卷種與課次範圍，從翰林智慧題庫自動篩選題目快速組成試卷。</div>\n      </div>\n      <div class=\"home-card purple\" onclick=\"openMode('compose')\">\n        <div class=\"hc-ico\">📄</div>\n        <div class=\"hc-title\">上傳成卷生題</div>\n        <div class=\"hc-desc\">上傳 1～5 份試卷 PDF，讓 AI 解析題型並重新組卷。</div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- ===== SETUP ===== -->\n<div id=\"screen-setup\" class=\"page hidden\">\n  <div class=\"setup-wrap\">\n    <div class=\"welcome\">\n      <h1>設定你的試卷</h1>\n      <p id=\"welcome-desc\">選好下列條件，AI 會為您快速組成一份試卷。</p>\n    </div>\n\n    <div class=\"form-card\">\n      <div class=\"fc-title\" id=\"fc-title\">出題條件</div>\n      <div class=\"fc-desc\" id=\"fc-desc\">先設定學制、科目與冊次。</div>\n\n      <div class=\"grid2\">\n        <div class=\"field random-only\">\n          <label>學制<span class=\"req\">*</span></label>\n          <div class=\"select\"><select id=\"sel-level\" onchange=\"onChange('level',this.value)\">\n            <option>國小</option><option>國中</option>\n          </select></div>\n        </div>\n        <div class=\"field random-only\">\n          <label>科目<span class=\"req\">*</span></label>\n          <div class=\"select\"><select id=\"sel-subject\" onchange=\"onChange('subject',this.value)\">\n            <option>國語</option><option>自然</option><option>數學</option>\n          </select></div>\n        </div>\n        <div class=\"field random-only\">\n          <label>冊次<span class=\"req\">*</span></label>\n          <div class=\"select\"><select id=\"sel-volume\" onchange=\"onChange('volume',this.value)\">\n            <option>一上</option><option>一下</option><option>二上</option><option>二下</option>\n            <option>三上</option><option>三下</option><option>四上</option><option>四下</option>\n            <option>五上</option><option>五下</option><option>六上</option><option>六下</option>\n          </select></div>\n        </div>\n      </div>\n\n      <!-- 上傳成卷生題：僅保留上傳，不出現課次範圍選取 -->\n      <div class=\"field full compose-only\" style=\"margin-top:18px\">\n        <label>上傳試卷 PDF<span class=\"req\">*</span></label>\n        <div class=\"dropzone\" onclick=\"fakeUpload()\">\n          <div class=\"dz-ico\">⬆</div>\n          <div class=\"dz-txt\">\n            <b>點擊上傳 PDF 檔案</b>\n            <p>可上傳歷屆試卷、模擬卷或自編試卷。僅支援 PDF，最多 5 份，至少 1 份。<span id=\"up-count\" style=\"color:var(--brand-dark);font-weight:700\"></span></p>\n          </div>\n        </div>\n        <div class=\"filelist\" id=\"file-list\"></div>\n      </div>\n\n      <div class=\"field full random-only\" style=\"margin-top:24px\">\n        <label>選擇卷種<span class=\"req\">*</span></label>\n        <div class=\"ptype-row\">\n          <div class=\"ptype\" id=\"pt-single\" onclick=\"pickType('單課卷')\">\n            <div class=\"pt-ico\">📄</div>\n            <div class=\"pt-tx\"><b>單課卷</b><span>針對單一課次出題</span></div>\n            <div class=\"pt-check\">✓</div>\n          </div>\n          <div class=\"ptype\" id=\"pt-exam\" onclick=\"pickType('段考卷')\">\n            <div class=\"pt-ico\">📚</div>\n            <div class=\"pt-tx\"><b>段考卷</b><span>可複選多個課次範圍</span></div>\n            <div class=\"pt-check\">✓</div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"field full random-only hidden\" id=\"lesson-block\" style=\"margin-top:22px\">\n        <label id=\"lesson-label\">課次<span class=\"req\">*</span></label>\n        <div class=\"select\" id=\"lesson-single\"><select id=\"sel-lesson\" onchange=\"onChange('lesson',this.value)\"></select></div>\n        <div id=\"lesson-multi\" class=\"hidden\">\n          <div class=\"range-tools\">\n            <span class=\"rt-count\" id=\"rt-count\">已選 0 課</span>\n            <button class=\"rt-btn\" onclick=\"selectAllLessons(true)\">全選</button>\n            <button class=\"rt-btn\" onclick=\"selectAllLessons(false)\">清除</button>\n          </div>\n          <div class=\"chip-cloud\" id=\"lesson-cloud\"></div>\n        </div>\n      </div>\n\n      <div class=\"gen-note\">\n        <span class=\"gn-ico\">✨</span>\n        <div><b>按下開始生成後，AI 會一次產生 10 題</b>，下一頁可逐題採用、換類題，或自行輸入指示微調。</div>\n      </div>\n\n      <div class=\"form-foot\">\n        <span class=\"foot-hint\" id=\"foot-hint\">選好條件後即可生成試卷</span>\n        <button class=\"btn-primary\" id=\"gen-btn\" onclick=\"startGenerate()\">開始生成 🚀</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- ===== RESULT ===== -->\n<div id=\"screen-result\" class=\"page hidden\">\n  <div class=\"res-wrap\">\n    <div class=\"exam-paper\" id=\"exam-paper\"></div>\n\n    <div class=\"res-foot\">\n      <span>翰林出版 © 2026</span>\n      <span>Powered by AI</span>\n    </div>\n  </div>\n\n  <!-- 底部固定操作列 -->\n  <div class=\"bottom-bar\">\n    <button class=\"bb-btn back\" onclick=\"goSetup()\">← 返回重新設定</button>\n    <button class=\"bb-btn regen-all\" id=\"btn-regen-all\" onclick=\"regenAll()\">＋ 再生成 10 題</button>\n    <div class=\"bb-spacer\"></div>\n    <span class=\"bb-count\" id=\"bb-count\">已採用 10 / 10 題</span>\n    <button class=\"bb-btn docx\" onclick=\"exportDoc('docx')\">📄 下載 .docx</button>\n    <button class=\"bb-btn pdf\" onclick=\"exportDoc('pdf')\">⬇ 下載 .pdf</button>\n  </div>\n</div>\n\n<!-- ===== FOOTER ===== -->\n<div class=\"site-foot\" id=\"site-foot\">\n  Copyright © 2026 Hanlin 翰林出版事業股份有限公司<br>\n  <span class=\"foot-sub\">本產品生成之內容由生成式 AI 產出，可能受技術限制與外部資料影響，不保證百分之百正確與完整。</span>\n</div>\n\n<!-- ===== LOADING ===== -->\n<div class=\"loading hidden\" id=\"loading\">\n  <div>\n    <div class=\"spinner\"></div>\n    <h2>正在生成試卷</h2>\n    <p>系統正在整理題目、答案與 AI 詳解，<br>請稍候片刻。</p>\n  </div>\n</div>\n\n<!-- ===== TOAST ===== -->\n<div class=\"toast-wrap\" id=\"toast-wrap\"></div>\n\n<script>\nconst Q_INIT = 10, Q_STEP = 10, Q_MAX = 30;\nlet GEN = [];\nconst state = {\n  mode:'random', level:'國小', subject:'國語', volume:'一上',\n  papertype:'', lesson:'第一課：看', lessons:new Set([0,1,2]),\n  files:[], selected:new Set(), editing:new Set(), thinking:new Set(),\n  version:'詳答卷', points:20\n};\nconst LESSONS = ['第一課：看','第二課：花園裡有什麼？','第三課：媽媽的音樂會','第四課：鞋',\n  '第五課：小種子快長大','第六課：奶奶的小跟班','第七課：作夢的雲','第八課：妹妹的紅雨鞋',\n  '第九課：七彩的虹','第十課：和你在一起','第十一課：生日快樂','第十二課：小黑'];\nconst FAKE_FILES = ['11_114國小自然1下_第三單元_觀測天氣.pdf','114學年上學期期中複習卷_自然.pdf',\n  '康軒版自然模擬卷_天氣單元.pdf','歷屆段考彙整_三年級自然.pdf','自編練習卷_雨量與氣溫.pdf','校內評量卷_自然科.pdf'];\n\nconst QUESTIONS = [\n  {type:'是非題', q:'雨量筒是用來測量風速的工具。', kind:'tf', opts:['是','否'], correct:1, ans:'B. 否',\n   explain:'雨量筒是用來測量降雨量的儀器，測量風速應使用風速計，故此敘述錯誤。'},\n  {type:'選擇題', q:'下列哪一種天氣資料，與氣象局發布「豪雨特報」的分級最直接相關？', kind:'mc',\n   opts:['單位時間的累積雨量','當日的最高氣溫','空氣的相對濕度','風向的變化'], correct:0, ans:'A. 單位時間的累積雨量',\n   explain:'豪雨分級是依據一段時間內的累積雨量來判定，雨量越多等級越高，故選 A。'},\n  {type:'選擇題', q:'想要記錄「一天中氣溫的變化」，最適合使用下列哪一種工具？', kind:'mc',\n   opts:['溫度計','雨量筒','風向計','濕度計'], correct:0, ans:'A. 溫度計',\n   explain:'觀測氣溫需使用溫度計，並在固定時間讀取數值以比較一天的變化，故選 A。'},\n  {type:'填充題', q:'氣象觀測中，測量降雨量常用的標準單位是「＿＿＿＿」。', kind:'fill', ans:'毫米（mm）',\n   explain:'降雨量以雨水累積的深度表示，標準單位為毫米（mm）。'},\n  {type:'是非題', q:'百葉箱的功能是保護箱內的氣象儀器，避免受到陽光直射與雨水影響。', kind:'tf',\n   opts:['是','否'], correct:0, ans:'A. 是',\n   explain:'百葉箱以白色百葉設計通風並反射陽光，可讓儀器在遮蔽環境下取得準確數據，故此敘述正確。'}\n];\n/* 圖題：AI 換題時「圖片固定保留」，僅重新生成文字（題幹／選項／答案／詳解） */\nconst IMG_QUESTION = {type:'選擇題', q:'如右圖，A、B、C、D、E、F 為六邊形的六個頂點。下列哪一個標示不可以表示此六邊形？',\n  kind:'mc', img:true, bookRef:'對應課本：P.198 隨堂練習', vi:0,\n  opts:['六邊形 ABCDEF','六邊形 FABCDE','六邊形 ACBDEF','六邊形 ABCDEF 反向 FEDCBA'], correct:2, ans:'C. 六邊形 ACBDEF',\n  explain:'多邊形命名需依頂點相鄰的順序（順時針或逆時針）連續標示，選項 C 的順序未依相鄰關係排列，故不能表示此六邊形。'};\n\n/* 同一張圖可共用的文字變體：AI 換題只在此清單中替換，圖片與課本頁碼不動 */\nconst IMG_VARIANTS = [\n  {q:'如右圖，A、B、C、D、E、F 為六邊形的六個頂點。下列哪一個標示不可以表示此六邊形？',\n   opts:['六邊形 ABCDEF','六邊形 FABCDE','六邊形 ACBDEF','六邊形 ABCDEF 反向 FEDCBA'], correct:2, ans:'C. 六邊形 ACBDEF',\n   explain:'多邊形命名需依頂點相鄰的順序（順時針或逆時針）連續標示，選項 C 的順序未依相鄰關係排列，故不能表示此六邊形。'},\n  {q:'如右圖的六邊形 ABCDEF 中，下列哪一組頂點是「相鄰」的兩個頂點？',\n   opts:['A 與 D','B 與 E','C 與 D','A 與 E'], correct:2, ans:'C. C 與 D',\n   explain:'相鄰頂點指的是以一條邊直接相連的兩點。由圖可知 C 與 D 之間有邊相連，其餘各組皆為對角線關係，故選 C。'},\n  {q:'如右圖的六邊形 ABCDEF，從頂點 A 出發共可畫出幾條對角線？',\n   opts:['2 條','3 條','4 條','5 條'], correct:1, ans:'B. 3 條',\n   explain:'從一個頂點可連到除自己與左右兩相鄰頂點以外的頂點，6－3＝3，故從 A 可畫出 3 條對角線，選 B。'},\n  {q:'如右圖的六邊形 ABCDEF，關於它的邊數與頂點數，下列敘述何者正確？',\n   opts:['邊有 5 條、頂點有 6 個','邊有 6 條、頂點有 6 個','邊有 6 條、頂點有 5 個','邊有 7 條、頂點有 6 個'], correct:1, ans:'B. 邊有 6 條、頂點有 6 個',\n   explain:'多邊形的邊數與頂點數相同，六邊形即有 6 個頂點與 6 條邊，故選 B。'}\n];\n\n/* ---------------- 點數 ---------------- */\nfunction renderPoints(){ document.getElementById('pt-coin').textContent = state.points; }\nfunction showPoints(){ toast('', `目前剩餘 ${state.points} 點，每次生成試卷將扣除 1 點（示意）`, '🪙'); }\n\n/* ---------------- Screen nav ---------------- */\nfunction showScreen(id){\n  ['screen-home','screen-setup','screen-result'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id));\n  document.getElementById('nav-tabs').classList.toggle('hidden', id==='screen-home');\n  document.getElementById('site-foot').classList.toggle('hidden', id==='screen-result');\n  window.scrollTo(0,0);\n}\nfunction goHome(){ showScreen('screen-home'); }\nfunction openMode(m){ state.mode=m; configureMode(); showScreen('screen-setup'); }\nfunction switchMode(m){ state.mode=m; configureMode(); showScreen('screen-setup'); }\n\nfunction configureMode(){\n  const m=state.mode, isCompose=m==='compose';\n  document.querySelectorAll('#nav-tabs .nav-tab').forEach(el=>el.classList.toggle('on',el.dataset.mode===m));\n  document.querySelectorAll('.random-only').forEach(el=>el.classList.toggle('hidden', isCompose));\n  document.querySelectorAll('.compose-only').forEach(el=>el.classList.toggle('hidden', !isCompose));\n  document.getElementById('fc-title').textContent = isCompose?'上傳試卷':'出題條件';\n  document.getElementById('fc-desc').textContent = isCompose?'上傳 1～5 份試卷 PDF，AI 會解析題型並重新組卷。':'先設定學制、科目與冊次，再選擇卷種。';\n  document.getElementById('welcome-desc').textContent = isCompose?'上傳試卷 PDF，AI 會解析題型並重新組成一份試卷。':'設定出題條件並選擇卷種，AI 會為您快速組卷。';\n  applyPaperType();\n  renderFiles();\n  refresh();\n}\n\n/* 卷種（僅卷類抽題模式使用；上傳成卷生題不顯示課次範圍） */\nfunction applyPaperType(){\n  const block=document.getElementById('lesson-block');\n  if(state.mode==='compose'){ block.classList.add('hidden'); return; }\n  const pt=state.papertype, isExam=pt==='段考卷';\n  document.getElementById('pt-single').classList.toggle('on', pt==='單課卷');\n  document.getElementById('pt-exam').classList.toggle('on', isExam);\n  if(!pt){ block.classList.add('hidden'); return; }\n  block.classList.remove('hidden');\n  document.getElementById('lesson-single').classList.toggle('hidden', isExam);\n  document.getElementById('lesson-multi').classList.toggle('hidden', !isExam);\n  document.getElementById('lesson-label').innerHTML = isExam\n    ? '課次範圍（可複選）<span class=\"req\">*</span>'\n    : '課次<span class=\"req\">*</span>';\n  if(isExam){ buildLessonChips(); }\n  else{ buildLessonSingle(); }\n}\nfunction buildLessonSingle(){\n  const sel=document.getElementById('sel-lesson');\n  sel.innerHTML = LESSONS.map(o=>`<option>${o}</option>`).join('');\n  if(!LESSONS.includes(state.lesson)) state.lesson=LESSONS[0];\n  sel.value=state.lesson;\n}\nfunction buildLessonChips(){\n  document.getElementById('lesson-cloud').innerHTML = LESSONS.map((t,i)=>\n    `<div class=\"lchip ${state.lessons.has(i)?'on':''}\" onclick=\"toggleLesson(${i},this)\"><span class=\"dot\">✓</span>${t}</div>`).join('');\n  document.getElementById('rt-count').textContent = `已選 ${state.lessons.size} 課`;\n}\nfunction toggleLesson(i,el){\n  if(state.lessons.has(i)) state.lessons.delete(i); else state.lessons.add(i);\n  el.classList.toggle('on');\n  document.getElementById('rt-count').textContent = `已選 ${state.lessons.size} 課`;\n  refresh();\n}\nfunction selectAllLessons(all){\n  state.lessons = all ? new Set(LESSONS.map((_,i)=>i)) : new Set();\n  buildLessonChips(); refresh();\n}\n\n/* ---------------- Interactions ---------------- */\nfunction pickType(t){ state.papertype=t; applyPaperType(); refresh(); }\nfunction onChange(key,val){ state[key]=val; refresh(); }\nfunction fakeUpload(){ if(state.files.length>=5){alert('（Prototype）最多上傳 5 份');return;} state.files.push(FAKE_FILES[state.files.length]); renderFiles(); refresh(); }\nfunction delFile(i){ state.files.splice(i,1); renderFiles(); refresh(); }\nfunction renderFiles(){\n  document.getElementById('file-list').innerHTML=state.files.map((f,i)=>`<div class=\"file-item\"><span class=\"fi-ico\">📄</span><span class=\"fi-name\">${f}</span><button class=\"fi-del\" onclick=\"delFile(${i})\">×</button></div>`).join('');\n  document.getElementById('up-count').textContent = state.files.length?`（已上傳 ${state.files.length} / 5 份）`:'';\n}\nfunction refresh(){\n  const btn=document.getElementById('gen-btn'), hint=document.getElementById('foot-hint');\n  if(state.mode==='compose' && state.files.length<1){\n    btn.disabled=true; btn.textContent='請先上傳 PDF';\n    hint.className='foot-hint warn'; hint.textContent='請至少上傳 1 份試卷 PDF 才能生成';\n  }else if(state.mode==='random' && !state.papertype){\n    btn.disabled=true; btn.textContent='請先選擇卷種';\n    hint.className='foot-hint warn'; hint.textContent='請先選擇卷種（單課卷或段考卷）';\n  }else if(state.mode==='random' && state.papertype==='段考卷' && state.lessons.size===0){\n    btn.disabled=true; btn.textContent='請先選擇課次';\n    hint.className='foot-hint warn'; hint.textContent='段考卷至少需複選 1 個課次';\n  }else{\n    btn.disabled=false; btn.innerHTML='開始生成 🚀';\n    hint.className='foot-hint'; hint.textContent='條件已就緒，可以生成試卷了！';\n  }\n}\n\n/* ---------------- Generate ---------------- */\n/* 附加 n 題到 GEN 後面（複製一份，編修不影響題庫） */\nfunction appendQuestions(n){\n  const isCompose=state.mode==='compose';\n  const start=GEN.length;\n  for(let i=0;i<n;i++){\n    const gi=start+i;\n    const src = (isCompose && gi===0) ? IMG_QUESTION : QUESTIONS[gi%QUESTIONS.length];\n    GEN.push(Object.assign({}, src, {diff:null, edited:false}));\n  }\n}\nfunction buildGenList(){\n  GEN=[];\n  appendQuestions(Q_INIT);\n  state.selected = new Set(GEN.map((_,i)=>i));\n  state.thinking = new Set();\n}\nfunction startGenerate(){\n  document.getElementById('loading').classList.remove('hidden');\n  setTimeout(()=>{\n    document.getElementById('loading').classList.add('hidden');\n    if(state.points>0){ state.points--; renderPoints(); }\n    buildGenList(); renderResult(); showScreen('screen-result');\n  },1800);\n}\nfunction goSetup(){ showScreen('screen-setup'); }\n\nfunction getRangeText(){\n  if(state.mode==='compose') return `依上傳之試卷（${state.files.length} 份）`;\n  if(state.papertype==='段考卷'){\n    const picked=[...state.lessons].sort((a,b)=>a-b);\n    return picked.length? (picked.length>=3? `${LESSONS[picked[0]]} 等 ${picked.length} 課` : picked.map(i=>LESSONS[i]).join('、')) : '未選課次';\n  }\n  return state.lesson;\n}\n\n/* ---------------- Result ---------------- */\nfunction renderResult(){\n  // 「再生成 10 題」僅在卷類抽題顯示，上傳成卷生題隱藏；達 30 題上限則停用\n  const rb=document.getElementById('btn-regen-all');\n  if(rb){\n    rb.classList.toggle('hidden', state.mode==='compose');\n    const atMax = GEN.length >= Q_MAX;\n    rb.disabled = atMax;\n    rb.textContent = atMax ? '已達 30 題上限' : '＋ 再生成 10 題';\n  }\n  renderPaper();\n}\n\n/* 卷頭（詳答卷式）+ 逐題（正解框 + 換類題工具列） */\nfunction renderPaper(){\n  const isCompose=state.mode==='compose';\n  const levelName = isCompose ? '' : (state.level || '國小');\n  const subjectName = isCompose ? '綜合' : (state.subject || '綜合');\n\n  let html=`<div class=\"paper-note\">🛠 編輯工具僅顯示於畫面，不會列印於下載的試卷</div>`;\n  html+=`<div class=\"exam-head\">\n    <div class=\"eh-line\">${levelName}${subjectName}　命題教師：<span class=\"blank wide\"></span></div>\n    <div class=\"eh-line\"><span class=\"blank\"></span> 年　<span class=\"blank\"></span> 班　座號：<span class=\"blank\"></span>　姓名：<span class=\"blank wide\"></span></div>\n    <div class=\"eh-range\">範圍：${getRangeText()}</div>\n  </div>`;\n  html+=`<div class=\"select-row\">\n    <span class=\"sr-label\">採用設定</span>\n    <button class=\"sr-btn\" onclick=\"adoptAll(true)\">☑ 全選採用</button>\n    <button class=\"sr-btn\" onclick=\"adoptAll(false)\">☐ 全部取消</button>\n    <span class=\"sr-hint\">未採用的題目不會列入下載的試卷</span>\n  </div>`;\n\n  let num=0;\n  html+=GEN.map((q,idx)=>{\n    if(state.selected.has(idx)) num++;\n    return renderEqInner(idx, state.selected.has(idx)?num:null);\n  }).join('');\n\n  document.getElementById('exam-paper').innerHTML=html;\n  updateSbCount();\n}\n\n/* 單題內層（供整卷與單題重繪共用） */\nfunction renderEqInner(idx, num){\n  const q=GEN[idx];\n  const on=state.selected.has(idx);\n  const isThinking=state.thinking.has(idx);\n  const adopt=`<div class=\"eq-left\">\n      <div class=\"adopt-box\" onclick=\"event.stopPropagation();adoptQuestion(${idx})\" title=\"${on?'點擊改為略過':'點擊改為採用'}\">${on?'✓':''}</div>\n      <div class=\"adopt-lab\">${on?'採用':'略過'}</div>\n    </div>`;\n  const swap=`<button class=\"ai-swap\" onclick=\"regenSimilar(${idx})\" title=\"換一題同類型\">🔄 AI換題</button>`;\n\n  let tags='';\n  if(q.flag) tags+=`<span class=\"q-flag\">${q.flag}</span>`;\n  if(q.diff==='hard') tags+=`<span class=\"q-diff hard\">難度：進階 ⬆</span>`;\n  if(q.diff==='easy') tags+=`<span class=\"q-diff easy\">難度：基礎 ⬇</span>`;\n  if(q.edited) tags+=`<span class=\"q-diff edited\">✏️ 已編修</span>`;\n\n  const badge = num ? `<span class=\"eq-badge\">${num}</span>` : `<span class=\"eq-badge off\">–</span>`;\n  const paren = q.kind==='fill' ? '' : `<span class=\"eq-paren\">（　）</span>`;\n  const head=`<div class=\"eq-head\">${badge}${paren}<span class=\"eq-stem\">${q.q}${tags}</span></div>`;\n\n  const img=q.img?`<div class=\"eq-img\"><span class=\"book-ref\">${q.bookRef||''}</span><svg viewBox=\"0 0 200 150\" width=\"100%\"><polygon points=\"70,30 120,35 145,80 115,120 60,115 35,70\" fill=\"#e9eef7\" stroke=\"#5b6b86\" stroke-width=\"1.5\"/><text x=\"62\" y=\"26\" font-size=\"13\">A</text><text x=\"122\" y=\"30\" font-size=\"13\">F</text><text x=\"150\" y=\"82\" font-size=\"13\">E</text><text x=\"118\" y=\"135\" font-size=\"13\">D</text><text x=\"52\" y=\"132\" font-size=\"13\">C</text><text x=\"22\" y=\"70\" font-size=\"13\">B</text></svg></div>`:'';\n\n  let body='';\n  if(q.kind==='fill'){\n    body=`<div class=\"eq-fill\">作答：＿＿＿＿＿＿＿＿＿＿</div>`;\n  }else{\n    body=`<div class=\"eq-opts\">${q.opts.map((o,i)=>`<div class=\"eq-opt\"><span class=\"on\">(${i+1})</span><span class=\"ot\">${o}</span></div>`).join('')}</div>`;\n  }\n  const ansText = q.kind==='fill' ? q.ans : `(${q.correct+1})`;\n  const ansBox=`<div class=\"ans-box\"><div class=\"ab-ans\">正解：${ansText}</div><div class=\"ab-exp\">${q.explain}</div></div>`;\n\n  const veil=isThinking?`<div class=\"think-veil\"><span class=\"mini-spin\"></span>AI 生成中…</div>`:'';\n\n  return `<div class=\"eq ${on?'':'skip'} ${isThinking?'thinking':''}\" id=\"eq-${idx}\">\n    ${veil}${adopt}\n    <div class=\"eq-body\">\n      <div class=\"eq-toprow\">${swap}</div>\n      ${head}${img}${body}${ansBox}\n    </div>\n  </div>`;\n}\n\n/* 只重繪單一題（不變動題號時使用） */\nfunction updateOneEq(idx){\n  let num=null;\n  if(state.selected.has(idx)){\n    num=0;\n    for(let i=0;i<=idx;i++){ if(state.selected.has(i)) num++; }\n  }\n  const el=document.getElementById('eq-'+idx);\n  if(el) el.outerHTML = renderEqInner(idx, num);\n}\n\n/* 採用/略過（會變動題號 → 整卷重繪） */\nfunction adoptQuestion(idx){\n  if(state.selected.has(idx)) state.selected.delete(idx); else state.selected.add(idx);\n  renderPaper();\n}\nfunction adoptAll(all){\n  state.selected = all ? new Set(GEN.map((_,i)=>i)) : new Set();\n  renderPaper();\n  toast(all?'ok':'', all?'已全選採用':'已全部取消', all?'✓':'○');\n}\nfunction updateSbCount(){\n  const bc=document.getElementById('bb-count');\n  if(bc) bc.textContent = `已採用 ${state.selected.size} / ${GEN.length} 題`;\n}\n\n/* AI 換題（換一題同類型）；圖題保留原圖，只換文字 */\nfunction regenSimilar(idx){\n  if(GEN[idx].img){ return regenImgText(idx); }\n  aiThink(idx, ()=>{\n    const pool=QUESTIONS.filter(x=>x.kind===GEN[idx].kind);\n    const curInPool = QUESTIONS.find(x=>x.q===GEN[idx].q);\n    let pos = pool.indexOf(curInPool);\n    let cand = pool[(pos+1+pool.length)%pool.length] || pool[0];\n    if(cand){ GEN[idx]=Object.assign({}, cand, {diff:GEN[idx].diff, edited:true}); }\n    toast('ai', `第 ${humanNo(idx)} 題已換一題同類型類題`, '🔄');\n  });\n}\n\n/* 圖題換題：圖片、課本頁碼、題型、採用狀態全部保留，只替換題幹／選項／答案／詳解 */\nfunction regenImgText(idx){\n  aiThink(idx, ()=>{\n    const q=GEN[idx];\n    const next=((q.vi==null?0:q.vi)+1)%IMG_VARIANTS.length;\n    const v=IMG_VARIANTS[next];\n    GEN[idx]=Object.assign({}, q, {q:v.q, opts:v.opts.slice(), correct:v.correct, ans:v.ans, explain:v.explain, vi:next, edited:true});\n    toast('ai', `第 ${humanNo(idx)} 題已換一題同類型類題`, '🔄');\n  });\n}\n\n/* AI 思考動畫（示意） */\nfunction aiThink(idx, done){\n  state.thinking.add(idx);\n  updateOneEq(idx);\n  setTimeout(()=>{\n    state.thinking.delete(idx);\n    done();\n    updateOneEq(idx);\n  }, 900);\n}\n\n/* 題號（採用中回傳序號，略過回傳原始序） */\nfunction humanNo(idx){\n  if(!state.selected.has(idx)) return (idx+1)+'（略過中）';\n  let n=0; for(let i=0;i<=idx;i++){ if(state.selected.has(i)) n++; } return String(n);\n}\n\n/* ---------------- 底部操作列 ---------------- */\nfunction regenAll(){\n  if(GEN.length >= Q_MAX){ toast('','已達 30 題上限，若要更多題請返回首頁重新開始','！'); return; }\n  document.getElementById('loading').classList.remove('hidden');\n  setTimeout(()=>{\n    document.getElementById('loading').classList.add('hidden');\n    const start=GEN.length;\n    const add=Math.min(Q_STEP, Q_MAX-start);\n    appendQuestions(add);\n    for(let i=start;i<GEN.length;i++) state.selected.add(i);\n    renderResult();\n    const el=document.getElementById('eq-'+start); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});\n    toast('ai',`已再生成 ${add} 題，目前共 ${GEN.length} 題`,'✨');\n  }, 1000);\n}\nfunction exportDoc(fmt){ toast('ok',`將下載 .${fmt} 檔，共採用 ${state.selected.size} 題（示意）`,'⬇'); }\n\n/* ---------------- Toast ---------------- */\nfunction toast(kind,msg,ico){\n  const wrap=document.getElementById('toast-wrap');\n  const el=document.createElement('div');\n  el.className='toast '+(kind||'');\n  el.innerHTML=`<span class=\"t-ico\">${ico||'✓'}</span>${msg}`;\n  wrap.appendChild(el);\n  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),300); }, 2200);\n}\n\n/* init */\nrenderPoints();\nconfigureMode();\n<\/script>\n</body>\n</html>\n",R=[],fails=0;
