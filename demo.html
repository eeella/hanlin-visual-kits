<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>套版範本</title>
<!-- 範本頁＝基本範例檔（hanlin-web-starter/index.html）套上 ?kit= 那一組的顏色（2026-09-15）。
     不再各自維護一份 demo：元件、RWD、互動全部跟基本範例同一份，只換 tokens。
     作法：抓 starter 的 index.html 原文，把資源路徑指回 hanlin-web-starter/，
     在 tokens.css 後面插入「starter tokens × 這一組色值」的合併樣式（跟下載範例檔的 tokens.css 同一份邏輯），
     再把 hero／卡片文案換成這一組的 cp，最後整頁寫進來。 -->
<script src="defaults.js?v=20260916d"></script>
<script src="kits.js?v=edb539f4d2ae"></script>
<script src="skillpack.js?v=20260917a"></script>
<style>body{margin:0;font-family:"Noto Sans TC",sans-serif;color:#62778F}.hl-loading{padding:40px;text-align:center;font-size:14px}</style>
</head>
<body>
<p class="hl-loading">載入範本…</p>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('kit')||'hanlin';
  var K=(window.HL_KITS||[]).filter(function(k){return k.id===id})[0]||(window.HL_KITS||[])[0];
  var base='hanlin-web-starter/';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  Promise.all([fetch(base+'index.html').then(function(r){return r.text()}),fetch(base+'tokens.css').then(function(r){return r.text()})])
  .then(function(rs){
    var html=rs[0],tokens=rs[1];
    /* 資源路徑指回 starter 資料夾 */
    html=html.replace(/href="tokens\.css"/,'href="'+base+'tokens.css"')
             .replace(/href="hl-style\.css"/,'href="'+base+'hl-style.css"')
             .replace(/src="app\.js"/g,'src="'+base+'app.js"')
             .replace(/href="favicon\.svg"/g,'href="'+base+'favicon.svg"');
    /* 這一組的色值：合併 tokens 插在 hl-style.css 之前（後宣告蓋前宣告） */
    if(K&&window.HL_mergeStarterTokens){
      var merged=window.HL_mergeStarterTokens(tokens,K);
      html=html.replace('<link rel="stylesheet" href="'+base+'hl-style.css">','<style id="hl-kit-tokens">\n'+merged+'\n</style>\n<link rel="stylesheet" href="'+base+'hl-style.css">');
    }
    /* 文案換成這一組的（沒有就留 starter 原文） */
    var cp=(K&&K.cp)||{};
    if(cp.hl)html=html.replace(/<h1>[\s\S]*?<\/h1>/,'<h1>'+esc(cp.hl)+'</h1>');
    if(cp.sub)html=html.replace(/<p class="lead">[\s\S]*?<\/p>/,'<p class="lead">'+esc(cp.sub)+'</p>');
    if(cp.f&&cp.f.length){
      var i=0;
      html=html.replace(/<h3 class="card__title"><a class="card__link" href="#main">[^<]*<\/a><\/h3>\s*<p class="card__excerpt">[^<]*<\/p>/g,function(m){
        var f=cp.f[i++];if(!f)return m;
        return '<h3 class="card__title"><a class="card__link" href="#main">'+esc(f[0])+'</a></h3>\n            <p class="card__excerpt">'+esc(f[1])+'</p>';
      });
    }
    html=html.replace(/<title>[^<]*<\/title>/,'<title>'+esc(K?K.n:'套版範本')+'｜套版範本</title>');
    document.open();document.write(html);document.close();
  }).catch(function(e){document.body.innerHTML='<p class="hl-loading">範本載入失敗：'+esc(e&&e.message)+'</p>'});
})();
</script>
</body>
</html>
