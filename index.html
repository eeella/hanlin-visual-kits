<style>
/* ===== 首頁：選擇網站色彩風格（2026-09-14 改版） =====
   一頁只做一件事：三張風格卡，每張卡自己畫一個迷你網站，直接看到套上去長什麼樣。
   不再用 iframe 載 demo.html 縮圖——縮圖要等載入、要算縮放，而且三張看起來都一樣。 */
body.home{background:#fff;color:#3E4C5A;line-height:1.75;letter-spacing:0}
.home main{flex:1;width:100%}
.pin{width:100%;max-width:1280px;margin:0 auto;padding:0 24px}
.home .sec{padding:34px 0 60px}

.pick-hd{text-align:center}
.pick-hd h2{font-size:34px;font-weight:700;color:#16202B;letter-spacing:.01em;line-height:1.3;margin:0 0 6px}
.pick-hd p{font-size:16px;color:#6B7785;margin:0 0 28px}

/* 三欄卡片 */
.kit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.kit{
  background:#fff;border:1.5px solid #E1E8F0;border-radius:16px;padding:18px 20px 20px;
  display:flex;flex-direction:column;gap:16px;transition:box-shadow .15s,border-color .15s;
}
.kit:hover{box-shadow:var(--shadow-md)}
.kit.on{border-color:#1E5BC6;box-shadow:0 0 0 3px rgba(30,91,198,.15)}
.kit-top{display:flex;align-items:center;gap:10px;min-height:32px}
.kit-name{font-size:22px;font-weight:700;color:#16202B;letter-spacing:.02em;line-height:1.3}
.kit-top .chk{display:none;margin-left:auto;width:28px;height:28px;border-radius:50%;background:#1E5BC6;color:#fff;
  align-items:center;justify-content:center;flex:none}
.kit-top .chk .material-symbols-rounded{font-size:18px;font-variation-settings:'FILL' 1,'wght' 700}
.kit.on .kit-top .chk{display:inline-flex}

/* 迷你網站：導覽列＋主視覺，右側一張白卡放線稿插圖，顏色全部從這一組的色版來 */
.mini{border:1px solid #E1E8F0;border-radius:12px;overflow:hidden;font-size:12px;line-height:1.5;box-shadow:0 1px 3px rgba(20,45,70,.06)}
.mini-nav{display:flex;align-items:center;gap:4px;padding:12px 16px;background:#fff;border-bottom:1px solid #EDF1F6}
.mini-nav b{font-size:13px;font-weight:700;margin-right:auto}
.mini-nav span{padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:500}
.mini-hero{display:flex;align-items:center;gap:12px;padding:20px 16px 20px 18px;min-height:166px}
.mini-hero .tx{flex:1;min-width:0}
.kit .mini-hero h4{color:inherit;margin:0 0 8px;font-size:19px;white-space:nowrap;font-weight:700;line-height:1.3;letter-spacing:.02em}
.mini-hero p{margin:0 0 12px;font-size:11.5px;line-height:1.65;opacity:.92}
.mini-hero .bt{display:flex;gap:8px}
.mini-hero .bt span{padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;border:1.5px solid transparent;white-space:nowrap}
.mini-art{flex:none;width:118px;height:112px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.16)}
.mini-art svg{width:98px;height:80px;display:block}

/* 色票列：圓點在前、名稱在後 */
.kit-sw{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:nowrap;font-size:12.5px;color:#2B3541;padding:0 2px}
.kit-sw span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.kit-sw i{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.1);display:block;flex:none}

/* 元件套用預覽 */
.kit-ui{background:#F6F8FB;border:1px solid #EDF1F6;border-radius:12px;padding:14px 16px 16px}
.kit-ui .lab{font-size:14px;color:#3E4C5A;margin-bottom:12px}
.kit-ui .row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.kit-ui .h{font-size:20px;font-weight:700;white-space:nowrap}
.kit-ui .pb,.kit-ui .tg{border-radius:999px;font-size:12.5px;font-weight:700;padding:7px 13px;white-space:nowrap}
.kit-ui .tg{font-size:12px;padding:6px 11px;font-weight:500}
.kit-ui .in{flex:1;min-width:0;background:#fff;border:1px solid #D9E0E8;border-radius:8px;
  padding:8px 12px;font-size:12.5px;color:#9AA3AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 底部一顆整寬按鈕：採用中＝實心「目前使用」，其餘＝淺底「套用此風格」，進套版詳細頁 */
.kit-apply{display:block;text-align:center;font-size:16px;font-weight:700;border-radius:10px;padding:14px 12px;
  text-decoration:none;transition:filter .15s;letter-spacing:.04em;background:#E9EEF6;color:#1E5BC6}
.kit-apply:hover{filter:brightness(.95)}
.kit.on .kit-apply{background:#1E5BC6;color:#fff}
.kit-empty{font-size:13px;color:var(--gray-2);padding:26px 0}
.more-wrap{margin-top:30px;text-align:center}
@media(max-width:480px){.kit-grid{grid-template-columns:1fr}.pick-hd h2{font-size:28px}}

/* ===== Hero：照 Master/index.html 的比例（2026-09-14 依使用者要求加回首頁上方） ===== */
.hero{background:#F5D35B;border-bottom:1px solid #E7C34D}
.hero-in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;
  gap:56px;align-items:center;padding:76px 24px 80px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:500;
  letter-spacing:.16em;color:#6E5200;text-transform:uppercase}
.hero-txt h1{font-size:44px;font-weight:700;line-height:1.28;letter-spacing:-.02em;
  color:#3A2E00;margin:16px 0 18px}
.hero-txt>p{font-size:16px;color:#5C4A0A;max-width:520px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-art{position:relative;height:320px}
.ha-card{position:absolute;border-radius:14px;border:1px solid #E1E8F0;background:#fff;
  box-shadow:0 6px 18px rgba(11,44,82,.07)}
.ha-1{left:0;top:24px;width:60%;height:200px;background:#fff;border-color:#E7C34D}
.ha-2{right:8%;top:0;width:52%;height:170px;border-top:5px solid var(--brand)}
.ha-3{right:0;bottom:6px;width:46%;height:130px;background:#0B2C52;border-color:#0B2C52}
.ha-note{position:absolute;left:14%;bottom:10px;background:var(--brand);color:#fff;
  padding:14px 18px;border-radius:12px;font-size:13px;line-height:1.5;z-index:2}
.ha-note b{font-size:17px;font-weight:700}
@media(max-width:900px){
  .hero-in{grid-template-columns:1fr;gap:36px;padding:52px 24px 56px}
  .hero-txt h1{font-size:32px}
  .hero-art{height:240px}
}
</style>
</head>

<main>

  <section class="sec" id="kits">
   <div class="pin">
    <div class="pick-hd">
      <h2>選擇網站色彩風格</h2>
      <p>只調整背景、文字、按鈕與強調色，不影響版面、內容及元件。</p>
    </div>

    <div class="kit-grid" id="kitGrid"></div>
    <p class="kit-empty" id="kitEmpty" hidden>目前沒有可選的風格。</p>
    <div class="more-wrap">
      <a class="btn" href="templates.html" style="border-radius:14px;padding:11px 22px;font-size:14px;background:#005696;color:#fff">
        更多視覺套版（全部 <span id="kitCount2">—</span> 組）→</a>
    </div>
   </div>
  </section>

</main>

<script>
(function(){
  /* ===== 一次性交接旗標 ===== */
  /* 進任何頁一律清空上一次的暫存旗標；只有「同一次操作的跳頁」帶著一次性通行證才保留，
     通行證用完即丟，所以重整、直接開網址、換分頁一律是乾淨狀態。
     使用者自己的採用設定與匯入的檔案不在這裡清，只有他按「清除紀錄」才會清掉。 */
  var handoff=false;
  try{
    var _hp=sessionStorage.getItem('hanlin-handoff');
    sessionStorage.removeItem('hanlin-handoff');
    if(_hp){
      var _h=JSON.parse(_hp),_me=(location.pathname.split('/').pop()||'index.html');
      handoff=(_h&&_h.to===_me&&(Date.now()-(+_h.t||0))<10000);
    }
  }catch(e){handoff=false}
  if(!handoff){
    ['hanlin-import-pending','hanlin-settings-saved','hanlin-show-result'].forEach(function(k){localStorage.removeItem(k)});
  }
  /* 重新整理／新分頁進來就把匯入流程的資料清掉（共用 defaults.js 的那一份），
     不然匯入過一次之後，只是想重選風格套版也會一直被步驟列咬著。
     採用設定 hanlin-brand-theme 不清。 */
  if(window.HL_freshEntryReset){
    window.HL_freshEntryReset(handoff);
  }
  /* 從往返快取(bfcache)還原時重新載入，讓「採用中」與最新的採用設定同步 */
  window.addEventListener('pageshow',function(e){if(e.persisted)location.replace(location.href)});

  /* ===== Top 按鈕 ===== */
  var toTop=document.getElementById('toTop');
  toTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
  window.addEventListener('scroll',function(){toTop.classList.toggle('show',window.scrollY>400)});

  /* ===== 套版列表 ===== */
  var KITS=window.HL_KITS||[];
  var grid=document.getElementById('kitGrid');
  var empty=document.getElementById('kitEmpty');
  /* 目前採用的是哪一組：讀既有的採用設定，不另外存一份狀態 */
  var nowName='';
  try{nowName=((JSON.parse(localStorage.getItem('hanlin-brand-theme'))||{}).theme||{}).n||''}catch(e){}

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* 深底配白字、淺底配深字——只用來決定色帶上那行小標的顏色 */
  function lum(hex){
    var h=String(hex||'').replace('#','');
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(!/^[0-9a-f]{6}$/i.test(h))return 1;
    var c=[0,2,4].map(function(i){
      var v=parseInt(h.substr(i,2),16)/255;
      return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);
    });
    return .2126*c[0]+.7152*c[1]+.0722*c[2];
  }
  function onColor(hex){return lum(hex)<.35?'#fff':'rgba(0,0,0,.62)'}

  /* 分類標籤的副標：卡片右上那顆淺色 pill */
  var CATLAB={'專業':'專業穩重','自然':'自然溫暖','活潑':'活潑醒目','人文':'人文質感','潮流':'潮流大膽','科技':'科技俐落'};
  function tint(hex,pct){return 'color-mix(in srgb,'+hex+' '+pct+'%,#fff)'}
  /* 字色守門：想用的色（ink／主色）跟底色差不夠就退回安全色。
     有些組的 ink 是給深底用的淺色、主色是亮黃，直接拿來寫在淺底上會變隱形字。 */
  function pick(bg,prefer){
    if(lum(bg)>=.4)return lum(prefer)<.3?prefer:'#16202B';
    return lum(prefer)>.5?prefer:'#fff';
  }

  /* 線稿插圖：筆電＋書＋盆栽，線色用這一組的深色 */
  function art(col){
    var tint='color-mix(in srgb,'+col+' 10%,#fff)';
    return '<svg viewBox="0 0 112 92" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
      /* 筆電：螢幕、內框、底座 */
      '<rect x="38" y="14" width="48" height="34" rx="3.5" fill="'+tint+'"/><rect x="43" y="19" width="38" height="24" rx="1.5" fill="#fff"/>'+
      '<path d="M28 48h68l6 10a2 2 0 0 1-2 3H24a2 2 0 0 1-2-3z" fill="'+tint+'"/><path d="M53 54h18"/>'+
      /* 疊書 */
      '<rect x="4" y="46" width="26" height="8" rx="1.5" fill="'+tint+'"/><rect x="7" y="54" width="26" height="8" rx="1.5" fill="#fff"/>'+
      '<path d="M4 50h26M7 58h26" opacity=".5"/>'+
      /* 盆栽：三片葉、莖、盆 */
      '<path d="M97 34c-8 0-11 8-9 13 7 1 11-6 9-13z" fill="'+tint+'"/><path d="M97 34c8 0 11 8 9 13-7 1-11-6-9-13z" fill="'+tint+'"/>'+
      '<path d="M97 26c-4 5-4 12-2 18" /><path d="M97 44v18"/>'+
      '<path d="M88 62h18l-2 14a2 2 0 0 1-2 2H92a2 2 0 0 1-2-2z" fill="'+tint+'"/>'+
    '</svg>';
  }

  /* 卡片主視覺底色：這幾組的輔色是黑／近黑，整排看起來太重，
     改用規範文件裡的中間色或次級底色當主視覺底（色碼取自各組 DESIGN.md 的 token），
     按鈕也跟著換成同一份文件裡對得上的強調色。只影響卡片預覽，不動 kits.js。 */
  var HERO={
    dawho:   {hero:'#0094DF',btn:'#FF9F1C'},   /* 主要藍取代純黑底 */
    mustard: {hero:'#EEC66F',btn:'#2C1D18'},   /* color.mustard 專題區塊底；按鈕用 espresso */
    pine:    {hero:'#4D692D',btn:'#E3C874'},   /* color.moss 次級底 */
    avocado: {hero:'#D5CB86',btn:'#FF5E03'},   /* color.khaki 次級區塊底（導覽列已是 avocado 綠，主視覺要和它分開） */
    douclass:{hero:'#7747B5',btn:'#E8A33D'},   /* surface.strong 主紫 */
    gov:     {hero:'#FFC551',btn:'#C04C08'},   /* surface.strong 主金；按鈕用 tertiary 橘 */
    neon:    {hero:'#16B5D5',btn:'#FAD852'}    /* color.cyan 次級橫幅 */
  };
  function card(k){
    var ov=HERO[k.id]||{};
    var deep=ov.hero||k.s||k.p, light=k.i||k.bg||'#F4F7FB', ink=k.ink||'#1E3D60', btn=ov.btn||k.c;
    var heroTx=onColor(deep), cTx=onColor(btn);
    var navBg=k.bg||'#fff', navTx=pick(navBg,ink), pillBg=(Math.abs(lum(navBg)-lum(k.p))<.12)?k.c:k.p, pillTx=onColor(pillBg), liteTx=pick('#F6F8FB',ink), tagTx=pick(light,ink);
    var on=(k.n===nowName);
    var url='template.html?kit='+encodeURIComponent(k.id);
    return '<div class="kit'+(on?' on':'')+'">'+
      '<div class="kit-top">'+
        '<span class="kit-name">'+esc(k.n)+'</span>'+
        '<span class="chk"><span class="material-symbols-rounded">check</span></span>'+
      '</div>'+
      '<div class="mini" aria-hidden="true">'+
        '<div class="mini-nav" style="background:'+esc(navBg)+';color:'+navTx+'"><b>網站名稱</b>'+
          '<span style="background:'+esc(pillBg)+';color:'+pillTx+'">首頁</span><span>課程</span><span>關於</span><span>聯絡</span></div>'+
        '<div class="mini-hero" style="background:'+esc(deep)+';color:'+heroTx+'">'+
          '<div class="tx"><h4>打造你的專屬網站</h4>'+
          '<p>從靈感到上線，輕鬆建立屬於你的品牌，讓更多人看見你的價值。</p>'+
          '<div class="bt"><span style="background:'+esc(btn)+';color:'+cTx+'">立即開始</span>'+
            '<span style="border-color:'+heroTx+';color:'+heroTx+'">了解更多</span></div></div>'+
          '<div class="mini-art">'+art(deep)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="kit-sw">'+
        '<span><i style="background:'+esc(deep)+'"></i>頁面底色</span>'+
        '<span><i style="background:'+esc(light)+'"></i>區塊底色</span>'+
        '<span><i style="background:'+esc(btn)+'"></i>主要按鈕</span>'+
        '<span><i style="background:'+esc(k.p)+'"></i>強調色</span>'+
      '</div>'+
      '<div class="kit-ui"><div class="lab">元件套用預覽</div><div class="row">'+
        '<span class="h" style="color:'+liteTx+'">標題文字</span>'+
        '<span class="pb" style="background:'+esc(btn)+';color:'+cTx+'">主要按鈕</span>'+
        '<span class="tg" style="background:'+esc(light)+';color:'+tagTx+'">標題</span>'+
        '<span class="in">輸入內容…</span>'+
      '</div></div>'+
      '<a class="kit-apply" href="'+url+'" data-act="detail" data-kit="'+esc(k.id)+'">'+(on?'目前使用':'套用此風格')+'</a>'+
    '</div>';
  }

  var HOME_MAX=3;   /* 首頁只放一排三張；其餘用下面那顆按鈕帶到列表頁 */
  function render(){
    var list=KITS.slice(0,HOME_MAX);
    grid.innerHTML=list.map(card).join('');
    empty.hidden=list.length>0;
  }
  render();
  /* 說明裡的總組數讀資料，不寫死；render() 之後才有元素可寫 */
  ['kitCount','kitCount2'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.textContent=KITS.length;
  });

  function go(to){
    var file=to.split('?')[0];   /* 通行證比對的是檔名，不含查詢字串 */
    try{sessionStorage.setItem('hanlin-handoff',JSON.stringify({to:file,t:Date.now()}))}catch(e){}
    location.href=to;
  }
  document.getElementById('goImport').addEventListener('click',function(){go('import.html')});
  /* 卡片兩顆動作鈕：與視覺套版列表同一套行為，避免兩頁各寫一份而走鐘。
     「匯入套版」先把這一組寫進採用設定並標記已挑樣式，否則到了匯入頁
     會依「還沒挑樣式就兩邊一樣」的規則顯示成沒套版，那顆按鈕就沒意義了。 */
  grid.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a.kit-apply'):null;
    if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
    e.preventDefault();
    if(a.getAttribute('data-act')==='import'){
      var id=a.getAttribute('data-kit'),k=null;
      for(var i=0;i<KITS.length;i++)if(KITS[i].id===id)k=KITS[i];
      if(k){
        var prev={};
        try{prev=JSON.parse(localStorage.getItem('hanlin-brand-theme'))||{}}catch(_){}
        prev.theme={n:k.n,p:k.p,s:k.s,i:k.i,c:k.c,tk:k.tk,src:k.src,
                    bg:k.bg,ln:k.ln,mu:k.mu,ink:k.ink,ex:k.ex,rd:k.rd,sh:k.sh,bd:k.bd};
        prev.contrast=k.c;
        try{localStorage.setItem('hanlin-brand-theme',JSON.stringify(prev))}catch(_){}
      }
      try{sessionStorage.setItem('hanlin-import-styled','1')}catch(_){}
      go('import.html');
      return;
    }
    go(a.getAttribute('href'));
  });
})();
</script>
</body>
</html>
